Organizations:
  - &ref_1
    Name: manufacturer
    ID: manufacturerMSP
    MSPDir: crypto-config/peerOrganizations/manufacturer.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: >-
          OR('manufacturerMSP.admin', 'manufacturerMSP.peer',
          'manufacturerMSP.client')
      Writers:
        Type: Signature
        Rule: OR('manufacturerMSP.admin', 'manufacturerMSP.client')
      Admins:
        Type: Signature
        Rule: OR('manufacturerMSP.admin')
      Endorsement:
        Type: Signature
        Rule: OR('manufacturerMSP.peer')
    AnchorPeers:
      - Host: peer1.manufacturer.com
        Port: '7051'
  - &ref_2
    Name: distributor
    ID: distributorMSP
    MSPDir: crypto-config/peerOrganizations/distributor.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: >-
          OR('distributorMSP.admin', 'distributorMSP.peer',
          'distributorMSP.client')
