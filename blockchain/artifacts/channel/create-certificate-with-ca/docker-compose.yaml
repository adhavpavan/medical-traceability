      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - '9054:9054'
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./fabric-ca/pharmacy:/etc/hyperledger/fabric-ca-server
    container_name: ca.pharmacy.com
